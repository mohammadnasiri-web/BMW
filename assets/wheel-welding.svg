  <path d="M196 38c4 3 8 7 11 11" stroke="#FFB347" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M196 38c4 3 8 7 11 11" stroke="#FFF2D6" stroke-width="2" stroke-linecap="round"/>

